system:
  requirements_dir: "data/requirements"
  output_dir: "outputs"

llm:
  provider: "openai"                      # mock | openai | openai_compatible
  model: "openai-mirror/gpt-oss-120b"
  base_url: "http://10.10.11.7:11541/v1"  # vLLM OpenAI-compatible base URL
  api_key: "vllm"                         # use env OPENAI_API_KEY if empty
  context_window: 131072

embedding:
  provider: "openai"                      # mock | huggingface | openai | openai_compatible
  model: "BAAI/bge-m3"
  base_url: "http://10.10.11.7:11535/v1"  # vLLM OpenAI-compatible base URL for embeddings
  api_key: "vllm"                         # use env OPENAI_API_KEY if empty
  context_window: 8192

rag:
  chunk_size: 512
  chunk_overlap: 64
  splitter: "sentence"   # sentence | semantic | hierarchical | markdown
  persist_dir: "storage/rag"

parser:
  type: "llamaparse"         # simple | llamaparse | unstructured
  llamaparse:                # only for llamaparse of remote service
    api_key: "llx-vUUrTxYcsO7rmX4aJyj6Ea7qAibGhkgYe42m49liwz4f0hQi"
    result_type: "markdown"
    language: "zh"
  unstructured:              # only for unstructured of local service
    strategy: "fast"

kg:
  max_triplets_per_chunk: 8
  persist_dir: "storage/kg"


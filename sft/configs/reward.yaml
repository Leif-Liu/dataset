defaults:
  - _self_

seed: 42
output_dir: outputs/reward

model:
  # 注意：奖励模型一般用 base（非 instruct）也可；此处保持可跑示例
  name_or_path: gpt2
  trust_remote_code: true
  torch_dtype: auto

data:
  train_file: data/examples/rm_sample.jsonl
  eval_file: null
  prompt_key: prompt
  chosen_key: chosen
  rejected_key: rejected
  template: "### User:\n{prompt}\n\n### Assistant:\n"

tokenizer:
  padding_side: right
  truncation: true
  max_length: 2048

train:
  learning_rate: 8e-6
  weight_decay: 0.0
  warmup_ratio: 0.03
  lr_scheduler_type: cosine

  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8

  num_train_epochs: 1
  max_steps: 200
  logging_steps: 10
  save_steps: 100
  eval_steps: 0

  bf16: true
  fp16: false

wandb:
  enabled: false
  project: rm-demo
  run_name: null


